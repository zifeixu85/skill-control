appId: dev.skillcontrol.desktop
productName: Skill Control
copyright: Copyright © 2026 Skill Control contributors

directories:
  output: release
  buildResources: resources

files:
  - desktop/**/*
  - server/**/*
  - dist/**/*
  - resources/licenses/**/*
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - package.json

asar: true
npmRebuild: false
artifactName: Skill-Control-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.png
  # No Developer ID yet: sign the whole bundle ad hoc ("-") so the signature is
  # valid. Without it the bundle keeps only Electron's linker signature, which no
  # longer matches the packaged files, and macOS calls downloaded copies "damaged".
  # Hardened runtime only matters for notarization and would need
  # disable-library-validation with ad hoc signing; turn it back on with Developer ID.
  identity: "-"
  hardenedRuntime: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  target:
    - dmg
    - zip

dmg:
  sign: false
  window:
    width: 560
    height: 380
  contents:
    - x: 150
      y: 190
      type: file
    - x: 410
      y: 190
      type: link
      path: /Applications

win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: Skill-Control-${version}-${os}-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: Skill-Control-${version}-${os}-${arch}-portable.${ext}

linux:
  icon: resources/icon.png
  category: Development
  maintainer: Skill Control contributors <zifeixu85@users.noreply.github.com>
  syncDesktopName: true
  synopsis: Manage skills across local AI coding agents
  description: Scan, preview, import, export, and synchronize local AI agent skills.
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

# Update metadata only. Builds run with `--publish never`; the release workflow uploads
# the files. This makes electron-builder write latest-mac.yml / latest.yml /
# latest-linux.yml and the app-update.yml that electron-updater reads (Windows, Linux).
publish:
  - provider: github
    owner: zifeixu85
    repo: skill-control

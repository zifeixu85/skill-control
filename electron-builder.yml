appId: dev.skillcontrol.desktop
productName: Skill Control
copyright: Copyright © 2026 Skill Control contributors

directories:
  output: release
  buildResources: resources

files:
  - desktop/**/*
  - server/**/*
  - dist/**/*
  - resources/licenses/**/*
  # The companion skill `skill-control` (v0.3), copied into the library on request.
  - resources/skills/**/*
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - package.json

asar: true
# Plain files on disk, so copying the companion skill out of the app never depends on asar.
asarUnpack:
  - resources/skills/**
npmRebuild: false
artifactName: Skill-Control-${version}-${os}-${arch}.${ext}
# macOS signing (scripts/sign-mac.mjs): the fixed self-signed certificate from the CI secrets
# MAC_SIGN_P12_BASE64 / MAC_SIGN_P12_PASSWORD, or ad hoc without them. It runs as afterPack
# because mac.identity is null: electron-builder then signs nothing and skips afterSign hooks.
afterPack: ./scripts/sign-mac.mjs

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.png
  # Signed by scripts/sign-mac.mjs (afterPack): every nested binary, framework and helper,
  # then the app, with the fixed self-signed certificate (stable designated requirement, so
  # macOS keeps permissions across updates) or ad hoc for local builds. A bundle left with
  # only Electron's linker signature is reported as "damaged" on other Macs (v0.2.0).
  # Hardened runtime only matters for notarization; turn it back on with Developer ID.
  identity: null
  hardenedRuntime: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  target:
    - dmg
    - zip

dmg:
  sign: false
  # 560×380 with a @2x copy (scripts/build-dmg-background.mjs): an arrow and
  # "拖到「应用程序」· 第一次打开请看 README".
  background: dmg-background.png
  window:
    width: 560
    height: 380
  contents:
    - x: 150
      y: 190
      type: file
    - x: 410
      y: 190
      type: link
      path: /Applications

win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: Skill-Control-${version}-${os}-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: Skill-Control-${version}-${os}-${arch}-portable.${ext}

linux:
  icon: resources/icon.png
  category: Development
  maintainer: Skill Control contributors <zifeixu85@users.noreply.github.com>
  syncDesktopName: true
  synopsis: Manage skills across local AI coding agents
  description: Scan, preview, import, export, and synchronize local AI agent skills.
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

# Update metadata only. Builds run with `--publish never`; the release workflow uploads
# the files. This makes electron-builder write latest-mac.yml / latest.yml /
# latest-linux.yml and the app-update.yml that electron-updater reads (Windows, Linux).
publish:
  - provider: github
    owner: zifeixu85
    repo: skill-control

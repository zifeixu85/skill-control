changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 安全与修复 / Security and fixes
      labels:
        - security
        - bug
    - title: 新功能 / Features
      labels:
        - enhancement
        - feature
    - title: Agent 适配 / Agent adapters
      labels:
        - agent-adapter
    - title: 体验与文档 / Experience and docs
      labels:
        - design
        - accessibility
        - documentation
    - title: 其他变化 / Other changes
      labels:
        - "*"

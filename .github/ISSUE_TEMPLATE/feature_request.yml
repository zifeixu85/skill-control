name: 功能建议 / Feature request
description: 提议新的能力、Agent 适配或交互改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请从真实使用问题出发描述建议。路线图上的项目也欢迎补充具体场景和实现方案。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到了什么困难？
      placeholder: 当我需要……时，目前只能……，因此……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述理想流程、入口、关键状态和结果。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 包括当前的临时解决方式，或为什么现有功能不够。

  - type: dropdown
    id: scope
    attributes:
      label: 主要范围
      options:
        - Skill 扫描与展示
        - Skill 详情与文件预览
        - 导入、导出与 .skill 格式
        - 跨 Agent 同步
        - Agent 工具或目录适配
        - 桌面安装、更新与系统集成
        - 可访问性、视觉或交互
        - 开发体验、测试或文档
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: 本地数据与安全影响
      description: 是否新增文件读取、写入、网络请求、后台行为或权限？没有也请填写“无”。
      placeholder: 无；或说明读取/写入哪些目录、何时确认、如何恢复。
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: 示例或参考
      description: 可以附上草图、截图、公开链接或伪代码，请确保不含私人数据。

  - type: dropdown
    id: contribution
    attributes:
      label: 是否愿意参与实现
      options:
        - 可以提交 Pull Request
        - 可以帮助测试或补充设计
        - 暂时只能提供需求
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我搜索过现有 Issue 和路线图。
          required: true
        - label: 我没有在内容中包含私人 Skill、凭据或敏感路径。
          required: true

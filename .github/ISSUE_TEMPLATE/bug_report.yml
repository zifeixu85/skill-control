name: Bug 报告 / Bug report
description: 报告可复现的问题，帮助我们改进 Skill Control
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交问题。请不要在公开 Issue 中附上私人 Skill 内容、完整绝对路径、用户名或访问令牌。
        如果问题可能导致越权读取、任意写入或隐私泄露，请改用仓库的私密安全报告入口。

  - type: input
    id: version
    attributes:
      label: Skill Control 版本
      description: 例如 v0.1.0、main 的 commit SHA，或 Release 文件名。
      placeholder: v0.1.0
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: 使用方式
      options:
        - 从源码运行 / From source
        - macOS 桌面安装包
        - Windows 桌面安装包
        - Linux 桌面安装包
        - 其他 / Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      description: 请包括版本和 CPU 架构。
      placeholder: macOS 15.5 / Apple Silicon
    validations:
      required: true

  - type: input
    id: agents
    attributes:
      label: 涉及的 Agent 工具
      description: 例如 Codex、Claude Code 或自定义工具；与 Agent 无关时填写“无”。
      placeholder: Codex、Claude Code
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 简洁说明发生了什么，以及影响了哪个操作。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 选择……
        3. 点击……
        4. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: |
        可粘贴经过脱敏的日志，或拖入截图。请删除用户名、绝对路径、Skill 私有内容和凭据。
      render: shell

  - type: textarea
    id: context
    attributes:
      label: 其他信息
      description: 是否稳定复现、是否有临时解决办法，以及最近是否修改过工具数据源。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我搜索过现有 Issue，没有找到同一问题。
          required: true
        - label: 我已经移除私人路径、Skill 内容和凭据。
          required: true
        - label: 这不是未公开的安全漏洞。
          required: true

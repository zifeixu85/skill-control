name: Release desktop applications

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Install dependencies
        run: npm ci

      - name: Audit packaged runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run quality gates
        run: npm run lint && npm run typecheck && npm test

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            command: npm run desktop:build:mac:arm64
            smoke: npm run desktop:smoke
            artifact: desktop-macos-arm64
          - name: macOS x64
            os: macos-15-intel
            command: npm run desktop:build:mac:x64
            smoke: npm run desktop:smoke
            artifact: desktop-macos-x64
          - name: Windows
            os: windows-latest
            command: npm run desktop:build:win
            smoke: npm run desktop:smoke
            artifact: desktop-windows
          - name: Linux
            os: ubuntu-latest
            command: npm run desktop:build:linux
            smoke: xvfb-run --auto-servernum npm run desktop:smoke
            artifact: desktop-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop artifacts
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # An unsealed bundle (only Electron's linker signature) is reported as "damaged"
      # on other Macs; fail the release instead of shipping it.
      - name: Verify macOS code signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          apps=(release/mac*/"Skill Control.app")
          test "${#apps[@]}" -gt 0
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -q "Identifier=dev.skillcontrol.desktop"
          done

      - name: Configure Linux Chromium sandbox for smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox

      - name: Run packaged desktop smoke test
        run: ${{ matrix.smoke }}

      # Each macOS build writes its own latest-mac.yml; they are merged in update-manifests.
      - name: Check update metadata
        shell: bash
        run: |
          case "${RUNNER_OS}" in
            macOS)
              arch="$(node -p process.arch)"
              grep -q -- "-mac-${arch}.zip" release/latest-mac.yml
              mv release/latest-mac.yml "release/latest-mac-${arch}.yml"
              ;;
            Windows)
              grep -q -- "-setup.exe" release/latest.yml
              ;;
            Linux)
              grep -q -- ".AppImage" release/latest-linux.yml
              ;;
          esac

      - name: Upload platform artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
            !release/latest-mac-*.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload macOS update manifest
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: update-manifest-${{ matrix.artifact }}
          path: release/latest-mac-*.yml
          if-no-files-found: error
          retention-days: 14

  update-manifests:
    name: Merge macOS update manifests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Download macOS update manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: update-manifest-*
          path: mac-manifests
          merge-multiple: true

      - name: Merge latest-mac.yml
        run: node scripts/merge-mac-update-manifests.mjs mac-manifests update-manifests/latest-mac.yml

      - name: Upload merged manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-update-manifests
          path: update-manifests/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    permissions:
      contents: write
    needs:
      - verify
      - build
      - update-manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.13.0

      - name: Download platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          path: release-artifacts
          merge-multiple: true

      - name: Check update metadata
        working-directory: release-artifacts
        shell: bash
        run: |
          for file in latest-mac.yml latest.yml latest-linux.yml; do
            test -s "${file}"
          done
          if compgen -G "latest-mac-*.yml" > /dev/null; then
            echo "Per-architecture macOS manifests must not be published." >&2
            exit 1
          fi

      - name: Generate SHA-256 checksums
        working-directory: release-artifacts
        shell: bash
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          test -s SHA256SUMS.txt

      # docs/releases/vX.Y.Z.md may start with front matter `prerelease: true`.
      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          node scripts/release-notes.mjs \
            "docs/releases/${GITHUB_REF_NAME}.md" \
            "${RUNNER_TEMP}/release-notes.md" >> "${GITHUB_OUTPUT}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FOUND: ${{ steps.notes.outputs.found }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        shell: bash
        run: |
          release_args=(
            --verify-tag
            --title "Skill Control ${GITHUB_REF_NAME}"
          )
          if test "${NOTES_FOUND}" = "true"; then
            release_args+=(--notes-file "${RUNNER_TEMP}/release-notes.md")
          else
            release_args+=(--generate-notes)
          fi
          if test "${PRERELEASE}" = "true"; then
            release_args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            release-artifacts/* \
            "${release_args[@]}"
